Simulator:
  Name: DemoSim
  Services:
  - Name: Environment
    Type: DemoSim.Services.Environment
    Subscriptions:                # a service can subscribe to a global event too (handler runs on its own site)
    - OnBusFault: BusFault
  Events:                         # global, scheduler-less pub/sub — the EPS fires it, consumers on any site subscribe
  - Name: BusFault
    ArgType: System.Double        # payload: the failing bus voltage (stock SimEvent<double>)
  Sites:
  # The Bus site holds the EPS and its batteries. Consumers live on their own Loads site, so the EPS→consumer
  # reference genuinely crosses a site boundary (a CrossReference), while EPS→battery stays same-site (a Reference).
  - Name: Bus
    MaxEvents: 64
    Models:
    - Name: Eps
      Type: DemoSim.Power.Eps
      Models:
      - Batteries:
        - Name: Bat1
          Type: DemoSim.Power.Battery
          Config:
            CapacityWh: 2000
        - Name: Bat2
          Type: DemoSim.Power.Battery
          Config:
            CapacityWh: 2000
      Refs:                       # intra-site [Reference<Battery>] — the contained batteries, same site
      - Cells:
        - DemoSim.Eps.Bat1
        - DemoSim.Eps.Bat2
      CRefs:                      # cross-site [CrossReference<IPowerConsumer>] — a consumer on the Loads site
      - Consumers:
        - DemoSim.Heater
      Deps:
      - Environment: Environment
      Triggers:                   # producer: the [EventReference] BusFault handle ← the BusFault event
      - BusFault: BusFault
  - Name: Loads
    MaxEvents: 64
    Models:
    - Name: Heater
      Type: DemoSim.Power.Heater
      Config:
        RatedW: 50
      Subscriptions:              # consumer: the [EventHandler] OnBusFault method ← the BusFault event
      - OnBusFault: BusFault
